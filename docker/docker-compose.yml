services:
  hardino:
    build:
      context: ..
      dockerfile: docker/Dockerfile.app
    container_name: hardino
    ports:
      - "80:80"
      - "8001:8000"
    volumes:
      - hardino-data:/app/data
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped

volumes:
  hardino-data:
